name: Tests

# The suite needs FairDM, PostgreSQL with PostGIS, and the GDAL, GEOS and PROJ
# libraries. It runs in the FairDM development image against a PostGIS service.
# Both versions are the ones the FairDM pinned in uv.lock declares under
# [tool.fairdm.platform] in its pyproject.toml, so the package is tested on the
# platform that FairDM was tested on, and moves with it when the pin moves.

on:
  push:
    branches:
      - main
  # No paths filter: these checks are required, and a path-filtered required
  # check never reports on a pull request outside its paths, which blocks merge.
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform:
    name: Platform
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.read.outputs.image }}
      postgis: ${{ steps.read.outputs.postgis }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Read the platform the pinned FairDM declares
        id: read
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'EOF'
          import re
          import sys
          import tomllib
          import urllib.request

          with open("uv.lock", "rb") as lock:
              packages = tomllib.load(lock).get("package", [])
          fairdm = next((p for p in packages if p["name"] == "fairdm"), None)
          if fairdm is None or "registry" not in fairdm["source"]:
              sys.exit("uv.lock must pin fairdm from PyPI.")
          ref = f"v{fairdm['version']}"
          url = f"https://raw.githubusercontent.com/FAIR-DM/fairdm/{ref}/pyproject.toml"
          with urllib.request.urlopen(url, timeout=30) as response:
              project = tomllib.loads(response.read().decode())
          platform = project.get("tool", {}).get("fairdm", {}).get("platform", {})
          for key in ("image", "postgis"):
              if not re.fullmatch(r"[\w.-]+", str(platform.get(key, ""))):
                  sys.exit(f"FairDM {ref} declares no valid [tool.fairdm.platform] {key}.")
          print(f"FairDM {ref}: image {platform['image']}, PostGIS {platform['postgis']}",
                file=sys.stderr)
          print(f"image={platform['image']}")
          print(f"postgis={platform['postgis']}")
          EOF

  tests:
    name: Tests
    needs: platform
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgis/postgis:${{ needs.platform.outputs.postgis }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fairdm_geo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The image has the uv cache's directory but not its contents, so
      # dependencies are downloaded once per lock file.
      - name: Cache uv downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-

      # Root inside the container lets it write coverage.xml into the runner's
      # checkout. The host network reaches the PostGIS service on localhost.
      - name: Run tests
        env:
          IMAGE: ghcr.io/fair-dm/fairdm:${{ needs.platform.outputs.image }}-dev
        run: |
          mkdir -p "$HOME/.cache/uv"
          docker run --rm --network host --user root \
            -v "$GITHUB_WORKSPACE:/app" -w /app \
            -v "$HOME/.cache/uv:/root/.cache/uv" \
            -e POSTGRES_HOST=localhost -e POSTGRES_PORT=5432 \
            -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=fairdm_geo -e DJANGO_SETTINGS_MODULE=tests.settings \
            "$IMAGE" \
            sh -c 'uv sync --locked && pytest --cov --cov-report=xml'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ github.event.pull_request.head.repo.fork != true }}
