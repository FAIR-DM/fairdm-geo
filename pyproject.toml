[project]
name = "fairdm-geo"
description = "Geoscience integrations for the FairDM Framework"
license = "MIT"
version = "0.0.1"
readme = "README.md"
authors = [{ name = "Sam Jennings", email = "samuel.scott.jennings@gmail.com" }]
requires-python = '>=3.13,<4.0'
keywords = [
    "science",
    "research",
    "django",
    "fairdm",
    "geology",
    "geoscience",
    "earth science",
    "open data",
    "FAIR",
]
# fairdm is deliberately not a runtime dependency: a portal installs FairDM
# itself and pins its own version, and declaring it here caused resolver
# conflicts downstream. It is a development dependency below so the test suite
# can import it.
dependencies = [
    "django (>=6.0,<7.0)",
    "django-research-vocabs",
    "pyproj (>=3.7.1,<4.0)",
    "django-appconf (>=1.1.0,<2.0)",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/FAIR-DM/fairdm-geo"
Repository = "https://github.com/FAIR-DM/fairdm-geo"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fairdm_geo"]

[tool.hatch.build.targets.sdist]
include = ["/fairdm_geo", "/README.md", "/LICENSE"]

[tool.hatch.metadata]
# django-research-vocabs is installed from git (it is not on PyPI).
allow-direct-references = true

[dependency-groups]
dev = [
    "mvp-shared[dev,test]",
    "fairdm (>=0.3.0,<0.4.0)",
]

[tool.uv.sources]
mvp-shared = { git = "https://github.com/django-mvp/shared.git", tag = "v0.6.0" }
django-research-vocabs = { git = "https://github.com/SamuelJennings/django-research-vocabs" }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = [".", "tests"]
testpaths = ["tests", "fairdm_geo"]
python_files = ["test_*.py"]
addopts = ["--strict-markers", "--strict-config", "--tb=short", "-ra"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]

[tool.coverage.report]
skip_empty = true
show_missing = true

[tool.coverage.run]
branch = true
source = ["fairdm_geo"]
