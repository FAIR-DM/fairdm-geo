[project]
name = "fairdm-geo"
description = "Geoscience integrations for the FairDM Framework"
license = "MIT"
version = "0.0.1"
readme = "README.md"
authors = [{ name = "Sam Jennings", email = "samuel.scott.jennings@gmail.com" }]
requires-python = '>=3.13,<4.0'
keywords = [
    "science",
    "research",
    "django",
    "fairdm",
    "geology",
    "geoscience",
    "earth science",
    "open data",
    "FAIR",
]
# fairdm is deliberately not a runtime dependency: a portal installs FairDM
# itself and pins its own version, and declaring it here caused resolver
# conflicts downstream. It is a development dependency below so the test suite
# can import it.
dependencies = [
    "django (>=6.0,<7.0)",
    "django-controlled-vocabularies (>=0.3.1,<0.4.0)",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Framework :: Django",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/FAIR-DM/fairdm-geo"
Repository = "https://github.com/FAIR-DM/fairdm-geo"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fairdm_geo"]

[tool.hatch.build.targets.sdist]
include = ["/fairdm_geo", "/README.md", "/LICENSE"]

[dependency-groups]
dev = [
    "mvp-shared[dev,test]",
    "fairdm (>=0.3.0,<0.4.0)",
    # The pre-commit docstring check runs pydoclint, which mvp-shared v0.6.0
    # does not bundle.
    "pydoclint>=0.10.1",
]

[tool.uv.sources]
mvp-shared = { git = "https://github.com/django-mvp/shared.git", tag = "v0.6.0" }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = [".", "tests"]
testpaths = ["tests", "fairdm_geo"]
python_files = ["test_*.py"]
addopts = ["--strict-markers", "--strict-config", "--tb=short", "-ra"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]

[tool.coverage.report]
skip_empty = true
show_missing = true

[tool.coverage.run]
branch = true
source = ["fairdm_geo"]
omit = ["*/migrations/*"]

[tool.ruff]
extend = "ruff-base.toml"

[tool.ruff.lint.extend-per-file-ignores]
"tests/*" = ["S101", "S105", "F841"]

[tool.mypy]
files = ["fairdm_geo"]
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_ignores = true
show_error_codes = true
exclude = ["migrations/"]

[tool.deptry]
extend_exclude = ["tests/", "docs/"]

[tool.deptry.package_module_name_map]
django-controlled-vocabularies = "controlled_vocabularies"

[tool.deptry.per_rule_ignores]
# FairDM is imported throughout but is deliberately a development dependency
# only: the portal that installs this package installs FairDM itself (see the
# comment on [project].dependencies).
DEP004 = ["fairdm"]
